# Kiểm tra tự động mỗi lần push / mở PR. Vercel vẫn tự deploy như cũ —
# file này chỉ báo xanh/đỏ, không chặn và không đụng gì tới production.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Giá trị giả chỉ để build qua — không có khóa thật nào trong CI.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: https://writeright.unicoach.vn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # typecheck + kiểm tra giờ thi thử, đề, bài luyện tập, cổng SSO từ LMS
      - run: npm run verify
      - run: npx next build
